<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的第一個網頁</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 100px;
            background: #fdf6f0;
        }

        h1 {
            color: #ff8fab;
        }

        p {
            color: #555;
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 20px;
            background: #ff8fab;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #ff6f91;
        }
    </style>
</head>

<body>

    <h1>你好，歡迎來到我的網站！</h1>

    <p>這是一個最簡單的網頁。</p>

    <button onclick="alert('Hello!')">
        點我
    </button>

</body>
</html>
